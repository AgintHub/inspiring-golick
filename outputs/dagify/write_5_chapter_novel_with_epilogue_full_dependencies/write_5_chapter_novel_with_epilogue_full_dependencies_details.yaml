dag_type: plain_text
description: Workflow for writing a 5-chapter novel with a fully integrated epilogue
  that aggregates all chapter outputs
name: write_5_chapter_novel_with_epilogue_full_dependencies
nodes:
  define_story_premise:
    agent: false
    description: Create a concise story premise summarizing the core idea or theme
      of the novel.
    name: define_story_premise
    nodes_depended_on: []
    nodes_dependent_on:
    - outline_chapters
    prompt: Write a concise paragraph describing the main premise or central theme
      of a novel. Include the genre and the core idea or conflict around which the
      story revolves.
  develop_character_list:
    agent: false
    description: Generate a list of main and supporting characters with brief descriptions
      including their roles and traits.
    name: develop_character_list
    nodes_depended_on: []
    nodes_dependent_on:
    - outline_chapters
    prompt: Based on the story premise, list the main characters and key supporting
      characters. For each, provide a one-sentence description covering role, personality
      traits, and motivations.
  establish_setting:
    agent: false
    description: Define the novel's setting including time, place, and atmosphere.
    name: establish_setting
    nodes_depended_on: []
    nodes_dependent_on:
    - outline_chapters
    prompt: Describe the setting for the novel, specifying the time period, key locations,
      and overall atmosphere or mood. Keep it to a descriptive paragraph.
  outline_chapters:
    agent: false
    description: Create a detailed outline for all 5 chapters and epilogue incorporating
      premise, characters, and setting.
    name: outline_chapters
    nodes_depended_on:
    - develop_character_list
    - establish_setting
    nodes_dependent_on:
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3a
    - write_chapter_4
    - write_chapter_5
    - write_epilogue
    prompt: Using the story premise, character descriptions, and setting, create a
      detailed outline covering each of the 5 chapters and epilogue. For each chapter,
      specify the main events, character developments, and plot progression in 3-5
      bullet points.
  write_chapter_1:
    agent: false
    description: Write the full text of chapter 1 based on the novel outline, introducing
      characters and setting the initial conflict.
    name: write_chapter_1
    nodes_depended_on:
    - outline_chapters
    nodes_dependent_on:
    - write_chapter_2
    - write_chapter_3a
    - write_epilogue
    prompt: Write chapter 1 of the novel following the provided outline. Introduce
      main characters and setting, establish tone, and present the story's initial
      conflict or hook.
  write_chapter_2:
    agent: false
    description: Write the full text of chapter 2 continuing the story development
      and deepening conflict based on the outline.
    name: write_chapter_2
    nodes_depended_on:
    - outline_chapters
    nodes_dependent_on:
    - write_chapter_3a
    - write_chapter_4
    - write_epilogue
    prompt: Write chapter 2 of the novel following the provided outline. Develop character
      arcs and plot further, escalating the conflict introduced in chapter 1.
  write_chapter_3a:
    agent: false
    description: Write part A of chapter 3 focusing on rising action and narrative
      setup as outlined.
    name: write_chapter_3a
    nodes_depended_on:
    - outline_chapters
    nodes_dependent_on:
    - write_chapter_3b
    - write_chapter_4
    - write_epilogue
    prompt: Write chapter 3A of the novel following the provided outline. Focus on
      developing the initial rising action and setting up key plot elements for the
      chapter.
  write_chapter_3b:
    agent: false
    description: Write part B of chapter 3 continuing rising action and introducing
      complications as outlined.
    name: write_chapter_3b
    nodes_depended_on:
    - write_chapter_3a
    nodes_dependent_on:
    - write_chapter_4
    - write_chapter_5
    - write_epilogue
    prompt: Write chapter 3B of the novel following the provided outline. Introduce
      plot twists and increase tension among characters and events.
  write_chapter_4:
    agent: false
    description: Write the full text of chapter 4 nearing climax and setting up resolution
      according to the outline.
    name: write_chapter_4
    nodes_depended_on:
    - outline_chapters
    - write_chapter_3b
    nodes_dependent_on:
    - write_chapter_5
    - write_epilogue
    prompt: Write chapter 4 of the novel following the provided outline. Build toward
      the climax by resolving some conflicts and heightening others.
  write_chapter_5:
    agent: false
    description: Write the full text of chapter 5 delivering the climax and concluding
      the story.
    name: write_chapter_5
    nodes_depended_on:
    - outline_chapters
    nodes_dependent_on:
    - write_epilogue
    prompt: Write chapter 5 of the novel following the provided outline. Conclude
      major plotlines and provide a satisfying ending to the story.
  write_epilogue:
    agent: false
    description: Write the epilogue chapter synthesizing all chapter content and providing
      final resolution
    name: write_epilogue
    nodes_depended_on:
    - outline_chapters
    - write_chapter_1
    - write_chapter_2
    - write_chapter_3b
    - write_chapter_4
    - write_chapter_5
    nodes_dependent_on: []
    prompt: Write the epilogue chapter using the completed chapters and outline. Synthesize
      key narrative elements, show character aftermaths, resolve lingering threads,
      and provide thematic closure using direct references to previous chapter content.
