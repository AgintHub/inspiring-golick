dag_type: plain_text
description: Generates a detailed travel itinerary for Paris in April, including top
  attractions and a curated selection of restaurants that offer great ambiance and
  food at moderate prices.
name: paris_april_itinerary_planner
nodes:
  compile_afternoon_activity_slots:
    agent: false
    description: Assigns afternoon activities from the remaining attraction list.
    name: compile_afternoon_activity_slots
    nodes_depended_on:
    - compile_morning_activity_slots
    nodes_dependent_on: []
    prompt: Assign the remaining attractions from the top 10 list to the afternoon
      slots (1 PM - 5 PM) of the 3-day trip. Ensure flow with the morning activities.
      List the Day, Time, and Activity Name.
  compile_evening_dining_slots:
    agent: false
    description: Assigns dinner reservations from the curated restaurant lists.
    name: compile_evening_dining_slots
    nodes_depended_on:
    - curate_bistrot_style_restaurants
    - curate_trendy_neobistro_restaurants
    - determine_trip_dates_context
    nodes_dependent_on: []
    prompt: Select 3 distinct restaurants from the provided bistro and neo-bistro
      lists (one for each evening of the trip). Ensure variety in style. List the
      Day, Time (e.g., 8:00 PM), Restaurant Name, Neighborhood, and the Decor description.
  compile_morning_activity_slots:
    agent: false
    description: Assigns morning activities from the attraction list.
    name: compile_morning_activity_slots
    nodes_depended_on:
    - identify_top_paris_attractions
    - determine_trip_dates_context
    nodes_dependent_on: []
    prompt: Using the list of top 10 attractions, assign one attraction to each of
      the 3 mornings (9 AM - 12 PM) of the trip. Group nearby attractions if possible.
      List the Day, Time, and Activity Name.
  curate_bistrot_style_restaurants:
    agent: false
    description: Finds bistros with good food, price, and decor.
    name: curate_bistrot_style_restaurants
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Identify 5 authentic Parisian bistros known for good food, pricing in
      the moderate range (€€), and charming or traditional decor. Provide the name,
      neighborhood, and a 1-sentence description of the ambiance.
  curate_trendy_neobistro_restaurants:
    agent: false
    description: Finds modern restaurants with stylish decor and good prices.
    name: curate_trendy_neobistro_restaurants
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Identify 5 modern or 'neo-bistro' restaurants in Paris known for stylish
      interiors, good food, and moderate pricing (€€). Provide the name, neighborhood,
      and a 1-sentence description of the vibe.
  determine_trip_dates_context:
    agent: false
    description: Establishes the specific dates in April to determine length of stay
      for the itinerary.
    name: determine_trip_dates_context
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Assume the trip is for 3 days in mid-April (e.g., April 15th to April
      17th). Confirm these dates for the duration of the itinerary.
  generate_final_itinerary_document:
    agent: false
    description: Combines all activities and dining into a cohesive travel plan.
    name: generate_final_itinerary_document
    nodes_depended_on:
    - compile_morning_activity_slots
    - compile_afternoon_activity_slots
    - compile_evening_dining_slots
    nodes_dependent_on: []
    prompt: Combine the morning, afternoon, and evening slots into a cohesive 3-day
      itinerary format. Format clearly by Day and Time blocks, including the restaurant
      details.
  identify_top_paris_attractions:
    agent: false
    description: Lists must-see tourist spots and landmarks in Paris.
    name: identify_top_paris_attractions
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the top 10 tourist attractions in Paris suitable for a spring visit.
      Provide only the names of the attractions.
