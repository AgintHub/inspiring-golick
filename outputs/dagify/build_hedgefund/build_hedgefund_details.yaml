dag_type: typed
description: Generated workflow from UI.
name: build_hedgefund
nodes:
  choose_investment_strategy:
    agent: false
    description: Select a high-level investment strategy category
    name: choose_investment_strategy
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The chosen hedge fund strategy category (e.g., long/short equity,
        global macro, event-driven, quantitative)
      key: strategy_category
      type: str
    - description: One-sentence explanation of why this strategy aligns with the fund's
        objectives
      key: rationale
      type: str
    prompt: Choose a hedge fund strategy category (e.g., long/short equity, global
      macro) and provide a one-sentence rationale.
  choose_legal_entity_type:
    agent: false
    description: Identify the legal entity structure for the fund vehicle
    name: choose_legal_entity_type
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: The chosen legal entity type (e.g., LP, LLC, SICAV)
      key: entity_type
      type: str
    - description: A one-sentence explanation for the chosen entity type
      key: explanation
      type: str
    prompt: Choose the entity structure (e.g., LP, LLC, SICAV) and provide a one-sentence
      explanation.
  clarify_fund_objectives:
    agent: false
    description: State the primary business objectives for the hedge fund
    name: clarify_fund_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: An ordered list of eight concise objectives that define the hedge
        fund's investment purpose, competitive advantage, and long‑term strategic
        vision.
      key: objectives
      type: List[str]
    prompt: List the core objectives for launching the hedge fund in 8 bullet points,
      covering investment purpose, competitive edge, and long-term vision.
  compile_pitch_deck_outline:
    agent: false
    description: Framework for fundraising presentation
    name: compile_pitch_deck_outline
    nodes_depended_on:
    - clarify_fund_objectives
    - define_investor_profile
    - choose_investment_strategy
    - set_performance_and_risk_targets
    - draft_fee_structure
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: A list of the 10 slide titles in the order they appear in the pitch
        deck
      key: slide_titles
      type: List[str]
    - description: The total number of slides in the outline (should be 10)
      key: slide_count
      type: int
    prompt: Create a 10-slide outline (slide titles only) for an investor pitch deck
      incorporating objectives, strategy, team, edge, risk controls, fees, and expected
      returns.
  create_hiring_plan:
    agent: false
    description: Determine initial staffing requirements
    name: create_hiring_plan
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of essential full-time role names for launch
      key: role_names
      type: List[str]
    - description: List of one-line responsibilities for each role
      key: role_responsibilities
      type: List[str]
    - description: Total number of full-time positions required for launch
      key: total_headcount
      type: int
    prompt: List essential full-time positions for launch (max 8), with one-line responsibility
      each. Align roles with operations workflow gaps.
  define_asset_universe:
    agent: false
    description: Enumerate tradable assets and instruments
    name: define_asset_universe
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: List of asset classes (e.g., equities, bonds, commodities)
      key: asset_classes
      type: List[str]
    - description: List of specific instruments traded (e.g., S&P futures, gold)
      key: instruments_traded
      type: List[str]
    - description: List of geographic regions where assets are traded (e.g., US, Europe,
        Asia)
      key: geographic_regions
      type: List[str]
    prompt: List the specific asset classes and instruments the chosen strategy will
      trade (e.g., US large-cap equities, S&P futures).
  define_investor_profile:
    agent: false
    description: Describe the target investor segment for the fund
    name: define_investor_profile
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: A list of investor categories that best fit the fund’s objectives
        (e.g., family offices, pension funds, sovereign wealth funds).
      key: target_investor_segments
      type: List[str]
    - description: Typical investment size or commitment range (e.g., $5M–$20M, $50M–$200M).
      key: investment_size_range
      type: str
    - description: Preferred geographic region(s) for investors (e.g., North America,
        Europe, Asia).
      key: geographic_focus
      type: str
    - description: Typical investment horizon or lock‑up period (e.g., 3–5 years,
        5–10 years).
      key: investment_horizon
      type: str
    - description: Preferred risk tolerance level of the target investors (e.g., moderate,
        aggressive).
      key: risk_tolerance
      type: str
    - description: One‑sentence explanation linking the chosen investor profile to
        the fund’s objectives and strategy.
      key: rationale
      type: str
    prompt: Specify the ideal target investor profile (e.g., family offices, pensions)
      based on the stated fund objectives.
  define_technology_stack:
    agent: false
    description: Specify technology tools supporting operations
    name: define_technology_stack
    nodes_depended_on:
    - draft_operations_workflow
    nodes_dependent_on: []
    output_structure:
    - description: List of operation steps in the trade lifecycle (e.g., Idea Generation,
        Order Entry, Execution, Confirmation, Settlement, Reconciliation) in the same
        order as the tools list.
      key: operation_steps
      type: List[str]
    - description: List of primary software or infrastructure components mapped to
        each corresponding operation step. Each entry should name the system (e.g.,
        OMS, EMS, Trade Capture, Risk Management, Post‑Trade Matching) and may include
        a brief identifier or vendor if relevant.
      key: software_components
      type: List[str]
    prompt: Identify required software and infrastructure components for each operations
      step (e.g., OMS, EMS, risk system). Present as a 2-column table.
  design_compliance_program:
    agent: false
    description: Create compliance policies aligned with regulations and risk
    name: design_compliance_program
    nodes_depended_on:
    - identify_regulatory_requirements
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: List of regulatory requirements identified for the fund
      key: regulatory_requirements
      type: List[str]
    - description: Corresponding internal policy or procedure for each regulatory
        requirement
      key: internal_policies
      type: List[str]
    - description: Boolean flag indicating whether each regulatory requirement has
        been mapped to a policy
      key: compliance_check
      type: List[bool]
    - description: Total number of regulatory requirement to policy mappings generated
      key: mapping_count
      type: int
    prompt: Generate a compliance checklist mapping each regulatory requirement to
      a specific internal policy or procedure.
  design_risk_management_framework:
    agent: false
    description: Outline quantitative and qualitative risk controls
    name: design_risk_management_framework
    nodes_depended_on:
    - set_performance_and_risk_targets
    nodes_dependent_on: []
    output_structure:
    - description: Maximum position size as a percentage of portfolio value
      key: position_limit_percent
      type: float
    - description: Maximum Value‑at‑Risk (VaR) as a percentage of portfolio value
      key: var_limit_percent
      type: float
    - description: Trigger threshold for stop‑loss orders as a percentage of entry
        price
      key: stop_loss_percent
      type: float
    - description: Maximum number of days to liquidate positions in stressed scenarios
      key: liquidity_threshold_days
      type: int
    prompt: List core risk controls aligned with the target metrics, including position
      limits, VaR limits, stop‑loss rules, and liquidity thresholds.
  develop_timeline_and_milestones:
    agent: false
    description: Create phased schedule leading to fund launch
    name: develop_timeline_and_milestones
    nodes_depended_on:
    - draft_operations_workflow
    - define_technology_stack
    - create_hiring_plan
    nodes_dependent_on: []
    output_structure:
    - description: Sequential month numbers from 1 to 12 representing each milestone
        period
      key: month_numbers
      type: List[int]
    - description: Short title of each monthly milestone (e.g., "Finalize Operations
        Workflow")
      key: milestone_titles
      type: List[str]
    - description: Brief description of the activities and deliverables for each milestone
      key: milestone_descriptions
      type: List[str]
    - description: Primary responsible party or team for each milestone (e.g., "Operations
        Lead", "Tech Lead", "HR Manager")
      key: responsible_parties
      type: List[str]
    prompt: Prepare a launch timeline with monthly milestones over the next 12 months.
  draft_fee_structure:
    agent: false
    description: Set management and performance fee levels
    name: draft_fee_structure
    nodes_depended_on:
    - set_performance_and_risk_targets
    - estimate_setup_and_operating_costs
    nodes_dependent_on: []
    output_structure:
    - description: Annual management fee expressed as a percentage of assets under
        management
      key: management_fee_percent
      type: float
    - description: Annual performance fee expressed as a percentage of profits above
        the hurdle
      key: performance_fee_percent
      type: float
    - description: Minimum return percentage required before performance fees are
        triggered
      key: hurdle_rate_percent
      type: float
    - description: Percentage of profits allocated to the manager after the hurdle
        is met
      key: carry_percent
      type: float
    - description: Estimated minimum assets under management required to sustain the
        fee structure
      key: minimum_fund_size_usd
      type: int
    - description: Annual operating cost estimate that the fee structure aims to cover
      key: cost_recovery_usd
      type: int
    prompt: Propose management and performance fee percentages that balance cost recovery
      and competitiveness. Include incentive hurdle if relevant.
  draft_operations_workflow:
    agent: false
    description: Map core trade and post-trade operational steps
    name: draft_operations_workflow
    nodes_depended_on:
    - define_asset_universe
    - list_service_providers
    - design_risk_management_framework
    nodes_dependent_on: []
    output_structure:
    - description: Name of the first operational step (e.g., Idea Generation)
      key: step_1_name
      type: str
    - description: Primary party responsible for executing the first step
      key: step_1_responsible_party
      type: str
    - description: Name of the second operational step (e.g., Order Entry)
      key: step_2_name
      type: str
    - description: Primary party responsible for executing the second step
      key: step_2_responsible_party
      type: str
    - description: Name of the third operational step (e.g., Execution)
      key: step_3_name
      type: str
    - description: Primary party responsible for executing the third step
      key: step_3_responsible_party
      type: str
    - description: Name of the fourth operational step (e.g., Confirmation)
      key: step_4_name
      type: str
    - description: Primary party responsible for executing the fourth step
      key: step_4_responsible_party
      type: str
    - description: Name of the fifth operational step (e.g., Settlement)
      key: step_5_name
      type: str
    - description: Primary party responsible for executing the fifth step
      key: step_5_responsible_party
      type: str
    - description: Name of the sixth operational step (e.g., Reconciliation)
      key: step_6_name
      type: str
    - description: Primary party responsible for executing the sixth step
      key: step_6_responsible_party
      type: str
    - description: Concise textual summary of the entire trade lifecycle
      key: overall_process_summary
      type: str
    prompt: 'Sketch the daily trade lifecycle: idea generation → order entry → execution
      → confirmation → settlement → reconciliation. List each step with primary responsible
      party.'
  estimate_setup_and_operating_costs:
    agent: false
    description: Rough cost model for fund setup and operations
    name: estimate_setup_and_operating_costs
    nodes_depended_on:
    - list_service_providers
    nodes_dependent_on: []
    output_structure:
    - description: List of mandatory external service providers identified in the
        parent node
      key: providers
      type: List[str]
    - description: Annual cost estimate in USD for each corresponding provider in
        the providers list
      key: annual_costs_usd
      type: List[float]
    prompt: Provide a simple annual cost estimate (in USD) for each listed service
      provider, considering overhead (office, tech).
  identify_regulatory_requirements:
    agent: false
    description: Outline key regulatory filings and registrations needed for the chosen
      fund entity and jurisdiction.
    name: identify_regulatory_requirements
    nodes_depended_on:
    - select_jurisdiction
    nodes_dependent_on: []
    output_structure:
    - description: List of the primary regulatory filings or registration documents
        required.
      key: filings
      type: List[str]
    - description: List of governing regulatory bodies cited for each filing.
      key: regulatory_bodies
      type: List[str]
    - description: Total number of filings identified.
      key: filing_count
      type: int
    prompt: List the primary registrations or filings required for the selected entity
      and jurisdiction (e.g., SEC Form ADV). Provide citation to governing body names
      only.
  list_service_providers:
    agent: false
    description: Enumerate required third-party service providers
    name: list_service_providers
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A list of names of mandatory third‑party service providers
      key: service_provider_list
      type: List[str]
    - description: Corresponding short role descriptions for each provider (e.g.,
        "Prime Broker", "Fund Administrator", "Auditor")
      key: service_provider_roles
      type: List[str]
    - description: Primary contact person or title for each provider
      key: contact_persons
      type: List[str]
    prompt: Generate a checklist of mandatory external service providers (e.g., prime
      broker, fund administrator, auditor).
  outline_governance_structure:
    agent: false
    description: Define internal governance roles and duties
    name: outline_governance_structure
    nodes_depended_on:
    - choose_legal_entity_type
    nodes_dependent_on: []
    output_structure:
    - description: List of governance roles
      key: governance_roles
      type: List[str]
    - description: List of one-line descriptions for each governance role
      key: role_descriptions
      type: List[str]
    prompt: 'Draft a simple governance chart: roles of GP, investment manager, board
      (if any). Limit to 5 roles with one-line duties each.'
  produce_final_fund_plan_summary:
    agent: false
    description: Generate an all-in summary of the hedge fund plan
    name: produce_final_fund_plan_summary
    nodes_depended_on:
    - design_compliance_program
    - compile_pitch_deck_outline
    - develop_timeline_and_milestones
    nodes_dependent_on: []
    output_structure:
    - description: A concise summary of the hedge fund plan
      key: executive_summary
      type: str
    - description: Overview of the chosen investment strategy
      key: investment_strategy
      type: str
    - description: Description of the fund's legal and operational structure
      key: fund_structure
      type: str
    - description: Summary of risk management policies and procedures
      key: risk_management
      type: str
    - description: Outline of operational steps and responsible parties
      key: operational_plan
      type: str
    - description: Details on management and performance fees
      key: fee_structure
      type: str
    - description: Phased schedule leading to fund launch
      key: timeline
      type: str
    prompt: Synthesize prior outputs into a concise executive summary (≤400 words)
      covering strategy, structure, risk, ops, fees, timeline.
  select_investment_manager:
    agent: false
    description: Identify the investment manager or team responsible for executing
      the chosen hedge fund strategy and offer a concise overview of their expertise
      and role.
    name: select_investment_manager
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Full name or legal entity name of the investment manager or management
        team
      key: manager_name
      type: str
    - description: Primary role or title of the manager within the fund (e.g., Head
        of Trading, Portfolio Manager)
      key: manager_role
      type: str
    - description: One-sentence summary of the manager's relevant experience or track
        record
      key: manager_experience_summary
      type: str
    - description: Number of individuals comprising the investment management team
      key: team_size
      type: int
    prompt: Name the investment manager or team responsible for the strategy and provide
      a brief description.
  select_jurisdiction:
    agent: false
    description: Pick the fund domicile and note rationale
    name: select_jurisdiction
    nodes_depended_on:
    - clarify_fund_objectives
    nodes_dependent_on: []
    output_structure:
    - description: The name of the chosen fund domicile
      key: selected_jurisdiction
      type: str
    - description: Two key advantages of the selected jurisdiction
      key: pros
      type: List[str]
    - description: Two key disadvantages of the selected jurisdiction
      key: cons
      type: List[str]
    - description: Concise one‑sentence justification for the choice
      key: rationale_summary
      type: str
    prompt: Select the optimal fund domicile (e.g., Cayman, Delaware, Luxembourg)
      and provide 2 pros and 2 cons for the selected jurisdiction.
  set_performance_and_risk_targets:
    agent: false
    description: Quantify return and risk goals
    name: set_performance_and_risk_targets
    nodes_depended_on:
    - choose_investment_strategy
    nodes_dependent_on: []
    output_structure:
    - description: Numerical annual target for gross return (in %) consistent with
        the chosen strategy
      key: gross_return_target
      type: float
    - description: Numerical annual target for volatility (in %) consistent with the
        chosen strategy
      key: volatility_target
      type: float
    - description: Numerical annual target for Sharpe ratio consistent with the chosen
        strategy
      key: sharpe_ratio_target
      type: float
    - description: Numerical annual target for maximum drawdown (in %) consistent
        with the chosen strategy
      key: max_drawdown_target
      type: float
    prompt: Define numerical annual targets for gross return, volatility, Sharpe ratio,
      and maximum drawdown consistent with the chosen strategy.
